apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/ilienicolai/go-simple-webserver@sha256:sha256:6ae463100bf6db2f1384ff2eaab3a4b3b06a3e0fcf704ecb3618e45d85625f17
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
